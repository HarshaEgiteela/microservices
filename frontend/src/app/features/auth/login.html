<section class="min-h-[calc(100vh-68px)] px-5 py-10 sm:py-16">
  <div class="mx-auto grid max-w-4xl overflow-hidden rounded-3xl border border-gray-200 bg-white shadow-sm md:grid-cols-2">
    <div class="hidden flex-col justify-between bg-blue-700 p-9 text-white md:flex">
      <div>
        <span class="text-sm font-extrabold uppercase tracking-[0.2em] text-yellow-300">Welcome to ShopEase</span>
        <h1 class="mt-6 text-4xl font-black leading-tight">Your next great find is just a sign in away.</h1>
        <p class="mt-4 leading-7 text-blue-100">Sign in to manage your cart, place orders and follow deliveries.</p>
      </div>
      <div class="text-7xl" aria-hidden="true">🛍️</div>
    </div>

    <div class="p-7 sm:p-10">
      <p class="text-sm font-bold text-blue-700">YOUR ACCOUNT</p>
      <h2 class="mt-2 text-3xl font-black tracking-tight text-gray-900">Welcome back</h2>
      <p class="mt-2 text-sm text-gray-500">Sign in to continue shopping.</p>

      @if (info()) {
        <div role="status" class="mt-5 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-800">{{ info() }}</div>
      }
      @if (error()) {
        <div role="alert" class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</div>
      }

      <form class="mt-7 space-y-5" (ngSubmit)="submit()">
        <label class="block text-sm font-semibold text-gray-700">
          Email address
          <input [(ngModel)]="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100" />
        </label>
        <label class="block text-sm font-semibold text-gray-700">
          Password
          <input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" class="mt-2 w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-600 focus:ring-4 focus:ring-blue-100" />
        </label>
        <button type="submit" [disabled]="loading()" class="w-full rounded-xl bg-blue-700 px-5 py-3.5 font-bold text-white transition hover:bg-blue-800 disabled:cursor-wait disabled:opacity-60">
          {{ loading() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        New to ShopEase?
        <a routerLink="/register" class="font-bold text-blue-700 hover:underline">Create an account</a>
      </p>
    </div>
  </div>
</section>
