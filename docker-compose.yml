services:

  # -------------------------
  # Eureka Server
  # -------------------------
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # User Service
  # -------------------------
  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://microservices-db.c9igqemwszh9.ap-southeast-2.rds.amazonaws.com:3306/userdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # Product Service
  # -------------------------
  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://microservices-db.c9igqemwszh9.ap-southeast-2.rds.amazonaws.com:3306/productdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # Order Service
  # -------------------------
  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://microservices-db.c9igqemwszh9.ap-southeast-2.rds.amazonaws.com:3306/orderdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # API Gateway
  # -------------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10