services:

  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # Eureka Server
  # -------------------------
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # User Service
  # -------------------------
  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Harshae@0406
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # Product Service
  # -------------------------
  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/productdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Harshae@0406
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # Order Service
  # -------------------------
  order-service:
    build: ./order-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orderdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Harshae@0406
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -------------------------
  # API Gateway
  # -------------------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  mysql-data: